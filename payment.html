<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout & Payment - Thala 7 Sneaker Store</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- External Unified CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="payment-body">

  <main class="payment-page-wrapper">
    <div class="checkout-split-layout">

      <!-- ================= LEFT CONTAINER ================= -->
      <section class="checkout-left-pane">
        <!-- Sub-Heading -->
        <span class="checkout-subheading">Checkout</span>

        <!-- Contact Details -->
        <div class="checkout-section-block">
          <h2 class="section-title">Contact Details</h2>
          <div class="form-group">
            <label class="input-label" for="email-field">Email ID</label>
            <input type="email" id="email-field" placeholder="John Doe" class="rounded-input">
          </div>
        </div>

        <!-- Payment Details Card -->
        <div class="checkout-section-block">
          <h2 class="section-title">Payment</h2>

          <div class="payment-card-box">
            <!-- Payment Methods Top Selector -->
            <div class="payment-methods-grid">
              <label class="pay-method-pill active">
                <input type="radio" name="payment_method" checked>
                <i class="fa-regular fa-credit-card"></i>
                <span>Card</span>
              </label>

              <label class="pay-method-pill">
                <input type="radio" name="payment_method">
                <i class="fa-brands fa-bitcoin"></i>
                <span>Crypto</span>
              </label>

              <label class="pay-method-pill">
                <input type="radio" name="payment_method">
                <i class="fa-solid fa-building-columns"></i>
                <span>Bank</span>
              </label>

              <div class="pay-method-pill more-options-btn">
                <i class="fa-solid fa-ellipsis-vertical"></i>
              </div>
            </div>

            <!-- Card Inputs Form -->
            <div class="card-inputs-container">
              <div class="form-group">
                <label class="input-label" for="card-num">Card Number</label>
                <input type="text" id="card-num" placeholder="John Doe" class="rounded-input">
              </div>

              <div class="form-row-dual">
                <div class="form-group flex-1">
                  <label class="input-label" for="expiry">Expiry</label>
                  <input type="text" id="expiry" placeholder="MM/YY" class="rounded-input">
                </div>
                <div class="form-group flex-1">
                  <label class="input-label" for="cvc">CVC</label>
                  <input type="password" id="cvc" placeholder="***" maxlength="4" class="rounded-input">
                </div>
              </div>

              <div class="form-row-dual">
                <div class="form-group flex-1">
                  <label class="input-label" for="country">Country</label>
                  <div class="select-wrapper">
                    <select id="country" class="rounded-input rounded-select">
                      <option value="India" selected>India</option>
                      <option value="United States">United States</option>
                      <option value="United Kingdom">United Kingdom</option>
                    </select>
                    <i class="fa-solid fa-caret-down select-caret"></i>
                  </div>
                </div>
                <div class="form-group flex-1">
                  <label class="input-label" for="zip">ZIP</label>
                  <input type="text" id="zip" placeholder="XXXXX" class="rounded-input">
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ================= RIGHT CONTAINER ================= -->
      <aside class="checkout-right-pane">
        <h2 class="order-summary-heading">Order Summary</h2>

        <div class="order-summary-card">
          <label class="coupon-label" for="checkout-coupon">Enter Coupon Code</label>
          <div class="coupon-group">
            <input type="text" id="checkout-coupon" placeholder="COUPON CODE" class="coupon-input">
            <button type="button" class="btn-apply-coupon">Apply Coupon</button>
          </div>

          <div class="summary-breakdown">
            <div class="summary-row">
              <span class="summary-label">Sub Total</span>
              <span class="summary-val">&#8377;4,700</span>
            </div>
            <div class="summary-row">
              <span class="summary-label">Taxes(if applicable)</span>
              <span class="summary-val">&#8377;199</span>
            </div>
            <div class="summary-row">
              <span class="summary-label">Discount</span>
              <span class="summary-val">&#8377;0</span>
            </div>
            <div class="summary-row total-row">
              <span class="total-label">Total</span>
              <span class="total-val">&#8377;4,999</span>
            </div>
          </div>
        </div>

        <!-- Pay Now Button -->
        <button type="button" class="btn-pay-now">Pay Now &#8377;4,999</button>

        <!-- Trust Badges & Razorpay -->
        <div class="trust-badges-row">
          <span class="trust-badge-pill green-badge"><i class="fa-solid fa-shield-halved"></i> SECURE</span>
          <div class="razorpay-logo-badge">
            <svg class="razorpay-icon" viewBox="0 0 24 24" width="18" height="18" fill="#0055ff">
              <path d="M5.5 21L14.8 2.6H8.2L2.5 14.2l3 6.8z"/>
              <path d="M12.2 21l6.3-12.4h-5.2L8.5 21h3.7z" fill="#0c2340"/>
            </svg>
            <span class="razorpay-text">Razorpay</span>
          </div>
          <span class="trust-badge-pill verified-badge"><i class="fa-solid fa-award"></i> VERIFIED</span>
        </div>
      </aside>

    </div>
  </main>

</body>
</html>

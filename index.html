<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thala 7 Sneaker Store</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Font Awesome Icons for Search, Cart, Reviews, Stars, etc. -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <!-- Navigation Bar -->
        <header class="navbar">
            <div class="logo">
                Thala <span class="highlight-blue">7.</span>
            </div>

            <nav class="nav-links">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Brands <i class="fa-solid fa-chevron-down dropdown-icon"></i></a>
                <a href="#">More <i class="fa-solid fa-chevron-down dropdown-icon"></i></a>
                <a href="#">Contact</a>
            </nav>

            <div class="nav-actions">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" placeholder="Search">
                </div>
                <a href="cart.html">
                    <div class="cart-btn">
                        <i class="fa-solid fa-bag-shopping"></i>
                        <span class="cart-count">0</span>
                    </div>
                </a>
                <div class="profile-pic">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80"
                        alt="User Profile">
                </div>
            </div>
        </header>

        <!-- Hero Section -->
        <main class="hero">
            <!-- Left Div: Text Content -->
            <div class="hero-left">
                <div class="sub-brand">
                    <span class="brand-code">SEV<span>7</span>N</span>
                    <span class="by-text">BY MS DHONI</span>
                </div>
                <!-- Heading -->
                <h1 class="hero-title">
                    7!! Thala For <br>
                    a <span class="highlight-orange">Reason!</span>
                </h1>
                <!-- Description -->
                <p class="hero-desc">
                    Lorem ipsum dolor sit amet consectetur. Pretium quisque lorem feugiat justo at ut orci nisi.
                </p>
                <!-- Shop Now btn -->
                <a href="product.html" class="btn-shop">Shop Now</a>
            </div>

            <!-- Right Div: Sneaker Image -->
            <div class="hero-right">
                <img src="https://pngimg.com/d/running_shoes_PNG5816.png" alt="Thala 7 Sneaker" class="sneaker-img">
            </div>
        </main>

        <!-- Service Overview Section (Full Width, outside main hero) -->
        <section class="service-overview">
            <!-- 2k+ Review -->
            <div class="stat-card">
                <div class="icon-wrap">
                    <i class="fa-solid fa-comment-dots"></i>
                </div>
                <div class="stat-info">
                    <h3>2k+</h3>
                    <p>Reviews</p>
                </div>
            </div>
            <!-- 30k+ customers -->
            <div class="stat-card">
                <div class="icon-wrap">
                    <i class="fa-solid fa-user-group"></i>
                </div>
                <div class="stat-info">
                    <h3>30k+</h3>
                    <p>Customers</p>
                </div>
            </div>
            <!-- 4.5/5 Rating -->
            <div class="stat-card">
                <div class="icon-wrap">
                    <i class="fa-solid fa-certificate"></i>
                </div>
                <div class="stat-info">
                    <h3>High</h3>
                    <p>Quality</p>
                </div>
            </div>
            <!-- High Quality -->
            <div class="stat-card">
                <div class="icon-wrap">
                    <i class="fa-solid fa-star"></i>
                </div>
                <div class="stat-info">
                    <h3>4.5/5</h3>
                    <p>Rating</p>
                </div>
            </div>
        </section>
    </div>

</body>

</html>
